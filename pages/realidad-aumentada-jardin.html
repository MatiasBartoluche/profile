                <info-article class="info-article card-article" id="descripcion"
                        title="Descripción"
                        color="bottom-orange"
                        description="
                            En esta página encontrarás una herramienta didáctica pensada especialmente para docentes de nivel inicial, que busca enriquecer el aprendizaje a través de la realidad aumentada (RA).
                            <br><br>📱 ¿Cómo funciona?
                            Con solo utilizar la cámara de un dispositivo móvil y escanear un marcador impreso, los niños podrán ver aparecer en pantalla modelos 3D interactivos, que representan conceptos, personajes o elementos del entorno. Esta tecnología transforma una clase tradicional en una experiencia visual y lúdica.
                            <br><br>🎯 ¿Cuál es su finalidad?
                            Nuestra misión es ofrecer a los docentes una forma novedosa y accesible de enseñar, estimulando la curiosidad y el juego en el aula. Al integrar elementos virtuales en el mundo real, se promueve el aprendizaje activo, visual y significativo desde edades tempranas.">
                </info-article>

                <info-article class="info-article card-article" id="tecnologias"
                    title="Tecnologías"
                    color="bottom-blue"
                    description="
                        Esta pagina fue creada principalmente con HTML 5 y CSS 3, tambien fue utilizado Bootstrap 5.3.7 para agilizar la implementación de un carrusel de imagenes.
                        <br><br> Para la insercion de modelos en 3D se utilizó A-Frame 1.8.0, un framework web de código abierto para crear experiencias de realidad virtual (VR).
                        <br><br> En cuanto a la programación, se utilizó JQuery 3.6.0 y AR-JS 3.4.7.
                        <br><br>AR.js es una biblioteca de código abierto ligera para crear experiencias de Realidad Aumentada (AR) directamente en el navegador web, sin necesidad de instalar aplicaciones móviles ni contar con hardware especializado.
                    ">
                </info-article>

                <info-article class="info-article card-article" id="arquitectura"
                    title="Arquitectura"
                    color="bottom-sky"
                    description="
                        Las estructuras HTML, los estilos CSS y los comportamientos con JavaScript se encuentran separados en diferentes archivos para facilitar la manipulación y modificación de dichas partes.
                        <br><br>A su vez, los archivos se encuentran separados en diferentes directorios con la finalidad de agrupar archivos con las mismas extensiones en un solo lugar.
                        <br><br>El sistema de directorios es el siguiente:
                        <br><br><img src=../img/arq-realidad-aumentada.png>
                        <br><br>index.html : Página principal del proyecto.
                        <br><br>camara.html : Pagina por la cual se accede a la camara del dispositivo para poder iniciar la interaccion con la realidad aumentada.
                        <br><br>css : contiene los archivos de estilos de extensión .css para aplicar estilos a la página.
                        <br><br>img : carpeta que contiene archivos de extensión .png utilizados como recursos para las páginas.
                        <br><br>js :  carpeta que contiene scripts de extensión.js.
                        <br><br>assets : contiene archivos de extensión .patt utilizados para reconocimiento de marcadores, y archivos de los modelos 3D que se utilizarán para renderizar modelos segun el marcador que se haya detectado">
                </info-article>
